<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Look here! • Photo sounds</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="description" content="Tap a sound, then open the floating player for your photo.">
  <style>
    :root{color-scheme:dark;--bg:#0f1115;--panel:#191e2a;--text:#f2f4f8;--muted:#aab2c5;--accent:#7bd389;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:var(--bg)}
    *{box-sizing:border-box}
    body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    main{width:min(100%,480px);margin:0 auto;padding:36px 20px}
    h1{font-size:1.75rem;margin:0 0 28px;letter-spacing:-.04em}
    button,input,select{font:inherit}
    button,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
    button{min-height:48px;border:1px solid #343c4f;border-radius:14px;background:var(--panel);color:var(--text);padding:12px 16px}
    button:disabled{opacity:.4;cursor:not-allowed}
    button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    .sounds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:24px}
    .sound{aspect-ratio:1;padding:0;font-size:2rem;border:2px solid transparent;background:#1a202c}
    .sound[aria-pressed="true"]{background:#344b3f;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
    #pipBtn{width:100%;min-height:58px;background:var(--accent);color:#101b14;border:0;font-weight:650;margin-bottom:24px}
    details{border-top:1px solid #2a3040}
    summary{padding:18px 0;font-size:1rem;color:var(--muted)}
    .panel{padding:0 0 20px;display:grid;gap:18px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row button{flex:1}
    label{display:grid;gap:8px;font-size:.95rem;color:var(--muted)}
    .toggle{display:flex;align-items:center;justify-content:space-between;min-height:44px}
    input[type="checkbox"]{width:24px;height:24px;accent-color:var(--accent)}
    input[type="range"]{width:100%;accent-color:var(--accent)}
    input[type="number"],select{width:100%;min-height:48px;padding:10px 12px;color:var(--text);background:var(--panel);border:1px solid #343c4f;border-radius:10px}
    .hint,#recPill{margin:0;font-size:.875rem;line-height:1.5;color:var(--muted)}
    #notice{font-size:.875rem;line-height:1.5;color:#ffd166;margin:0 0 20px}
    #notice:empty,#recPill:empty{display:none}
    .delete{color:#ffaaaa}
    .media{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;pointer-events:none}
    @media(max-width:340px){main{padding:24px 14px}.sounds{gap:8px}.sound{font-size:1.6rem}}
  </style>
</head>
<body>
<main>
  <h1>Look here!</h1>
  <div id="soundGrid" class="sounds" role="group" aria-label="Sounds — tap to listen"></div>
  <button id="pipBtn">▣ Open floating player</button>
  <div id="notice" role="status" aria-live="polite"></div>

  <details id="recordingMenu">
    <summary>Recording</summary>
    <div class="panel">
      <p class="hint">Up to 10 seconds · saved on this device</p>
      <div class="row">
        <button id="recStartBtn">● Record</button>
        <button id="recStopBtn" disabled>Finish</button>
      </div>
      <div class="row">
        <button id="recSaveBtn" disabled>Save &amp; use</button>
        <button id="recDiscardBtn" class="delete" disabled>Delete</button>
      </div>
      <p id="recPill" role="status" aria-live="polite"></p>
    </div>
  </details>
  <details>
    <summary>Advanced</summary>
    <div class="panel">
      <label class="toggle" for="loopInp">Loop in player <input id="loopInp" type="checkbox"></label>
      <label for="intervalInp">Pause between sounds (seconds)<input id="intervalInp" type="number" min="0.5" max="30" step="0.5" inputmode="decimal"></label>
      <label for="volRange">Volume<input id="volRange" type="range" min="0" max="1" step="0.01"></label>
      <label for="patternSel">Pattern<select id="patternSel"><option value="single">Single</option><option value="double">Double</option><option value="burst">Burst</option></select></label>
      <button id="fsBtn">Fullscreen fallback</button>
    </div>
  </details>
  <canvas id="pipCanvas" class="media" width="640" height="360" aria-hidden="true"></canvas>
  <video id="pipVideo" class="media" playsinline aria-hidden="true"></video>
</main>
<script src="app.js" defer></script>
</body>
</html>
